# ATLAS — test and Linux build. The Windows installer is built on a Windows PC (scripts/build.ps1).
# Debian 12 (glibc 2.36): the executable runs also on distributions that are not the latest ones.
# On a tag (or run by hand with the tag) the archive is attached to the GitHub release of the tag.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag di cui compilare e allegare l'archivio Linux (es. v0.4.0)"
        required: true

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.14-slim-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Librerie di sistema
        # Qt libraries (PySide6 and the PyInstaller bundle) and objdump (binutils), needed by PyInstaller on Linux.
        # The xcb libraries are those of the Qt platform plugin, bundled with the executable.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends binutils libgl1 libegl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libgssapi-krb5-2 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 > /dev/null
      - run: pip install -q -e ".[dev]"
      - run: python -m pytest tests -q

  linux:
    needs: test
    runs-on: ubuntu-latest
    container: python:3.14-slim-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - name: Librerie di sistema
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends binutils libgl1 libegl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0 libgssapi-krb5-2 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 gh > /dev/null
      - run: pip install -q -e ".[dev]"
      - name: Archivio Linux
        run: |
          PYTHON=python sh scripts/build.sh
          VERSION=$(python -c "import arcadia_tool; print(arcadia_tool.__version__)")
          echo "ARCHIVE=dist/ATLAS-$VERSION-linux-x86_64.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.ARCHIVE }}
          retention-days: 30
      - name: Allegato alla release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "ATLAS ${TAG#v}" --notes ""
          gh release upload "$TAG" "$ARCHIVE" -R "$GITHUB_REPOSITORY" --clobber
