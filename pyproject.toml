[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.3.0"
description = "ATLAS – Arcadia Traceability, Logical Architecture Software: modellazione ARCADIA per l'EVC"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.10",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "dulwich>=0.22",
    "PyYAML>=6.0",
    "keyring>=25",
    "cryptography>=42",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.16",
    "pytest>=8",
]

[project.gui-scripts]
atlas = "arcadia_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcadia_tool = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
